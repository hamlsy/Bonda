spring:
  application:
    name: bonda
  profiles:
    default: local
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

server:
  port: ${PORT:8080}

app:
  cors:
    allowed-origin: ${CORS_ALLOWED_ORIGIN:http://localhost:5173}

bonda:
  ai:
    enabled: ${BONDA_AI_ENABLED:false}
    base-url: ${BONDA_AI_BASE_URL:https://api.openai.com/v1}
    api-key: ${OPENAI_API_KEY:}
    model: ${BONDA_AI_MODEL:gpt-5.6-luna}
    pricing-model: ${BONDA_AI_PRICING_MODEL:gpt-5.6-luna}
    input-cost-per-million-tokens: ${BONDA_AI_INPUT_COST_PER_MILLION_TOKENS:0.20}
    output-cost-per-million-tokens: ${BONDA_AI_OUTPUT_COST_PER_MILLION_TOKENS:1.20}
    max-attempts: ${BONDA_AI_MAX_ATTEMPTS:3}
    initial-backoff-ms: ${BONDA_AI_INITIAL_BACKOFF_MS:200}
    max-input-characters: ${BONDA_AI_MAX_INPUT_CHARACTERS:12000}
    max-output-tokens: ${BONDA_AI_MAX_OUTPUT_TOKENS:800}
    connect-timeout: ${BONDA_AI_CONNECT_TIMEOUT:5s}
    read-timeout: ${BONDA_AI_READ_TIMEOUT:30s}
  dart:
    base-url: https://opendart.fss.or.kr
    api-key: ${DART_API_KEY:}
    lookback-days: ${DART_LOOKBACK_DAYS:7}
    page-size: ${DART_PAGE_SIZE:100}
    max-pages: ${DART_MAX_PAGES:10}
    max-document-bytes: ${DART_MAX_DOCUMENT_BYTES:10485760}
    connect-timeout: ${DART_CONNECT_TIMEOUT:5s}
    read-timeout: ${DART_READ_TIMEOUT:20s}
    collection:
      enabled: ${DART_COLLECTION_ENABLED:false}
      cron: "${DART_COLLECTION_CRON:0 0 6 * * *}"
      zone: ${DART_COLLECTION_ZONE:Asia/Seoul}
